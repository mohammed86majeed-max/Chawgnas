<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#12262B" />
<title>چاوگناس</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap');
:root{
  --bg:#12262B; --surface:#1B383F; --surface2:#23454D;
  --gold:#CBA135; --rust:#B5533C; --cream:#F3ECDD; --muted:#8FAAB0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'Vazirmatn',sans-serif;overflow-x:hidden;}
.kurdish{font-family:'Noto Naskh Arabic',serif;}
.kilim{height:14px;background:repeating-linear-gradient(135deg,var(--gold) 0 7px,transparent 7px 14px),repeating-linear-gradient(45deg,var(--rust) 0 7px,transparent 7px 14px);background-size:14px 14px;opacity:.85;}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;}
h1{font-size:26px;font-weight:700;margin:6px 0 2px;color:var(--gold);font-family:'Noto Naskh Arabic',serif;}
.subtitle{font-size:13px;color:var(--muted);margin:0 0 18px;font-family:'Noto Naskh Arabic',serif;}
.menu-btn{background:var(--surface);border:1px solid var(--surface2);color:var(--gold);font-size:22px;border-radius:10px;padding:6px 12px;cursor:pointer;margin-top:8px;}
.menu-panel{position:absolute;left:16px;right:16px;top:70px;max-width:448px;margin:0 auto;background:var(--surface);border:1px solid var(--surface2);border-radius:14px;padding:8px;display:none;z-index:10;}
.menu-panel.open{display:block;}
.menu-item{display:block;width:100%;text-align:right;background:none;border:none;color:var(--cream);font-family:'Noto Naskh Arabic',serif;font-size:17px;padding:12px 10px;border-radius:10px;cursor:pointer;}
.menu-item:hover{background:var(--surface2);}
.card{background:var(--surface);border:1px solid var(--surface2);border-radius:14px;padding:12px 14px;margin-bottom:14px;}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px;font-family:'Noto Naskh Arabic',serif;}
.field{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--surface2);background:var(--surface);color:var(--cream);font-family:'Noto Naskh Arabic',serif;font-size:18px;}
.toggle-row{display:flex;gap:8px;margin-top:10px;}
.toggle-btn{flex:1;padding:9px;border-radius:10px;border:1px solid var(--surface2);background:var(--surface);color:var(--muted);font-size:15px;font-family:'Noto Naskh Arabic',serif;}
.toggle-btn.active{background:var(--rust);color:var(--cream);border-color:var(--rust);}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none;}
.tabs::-webkit-scrollbar {display:none;}
.tab-btn{font-family:'Noto Naskh Arabic',serif;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid var(--surface2);background:var(--surface);color:var(--muted);white-space:nowrap;flex:0 0 auto;}
.tab-btn.active{background:var(--gold);color:#1B383F;border-color:var(--gold);font-weight:700;}
.pcard{display:flex;flex-direction:column;gap:6px;animation: fadeIn 0.3s ease;}
@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
.prow{display:flex;justify-content:space-between;align-items:center;}
.pronoun{color:var(--gold);font-size:16px;font-weight:bold;}
.pnote{font-size:11px;color:var(--muted);font-family:'Noto Naskh Arabic',serif;}
.words{display:flex;justify-content:space-between;margin-top:6px;gap:10px;}
.word-pos{font-family:'Noto Naskh Arabic',serif;font-size:19px;color:var(--cream);flex:1;text-align:right;}
.word-neg{font-family:'Noto Naskh Arabic',serif;font-size:19px;color:#E3A08C;flex:1;text-align:left;}
.actionbtn{width:100%;padding:11px;border-radius:10px;border:none;font-family:'Noto Naskh Arabic',serif;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;}
.btn-save{background:var(--gold);color:#1B383F;}
.btn-del{background:transparent;border:1px solid var(--rust);color:var(--rust);}
.msg{font-size:13px;color:var(--gold);margin:8px 0 0;display:none;text-align:center;}
.alpha-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.alpha-cell{background:var(--surface);border:1px solid var(--surface2);border-radius:12px;padding:12px 6px;text-align:center;}
.alpha-letter{font-family:'Noto Naskh Arabic',serif;font-size:28px;color:var(--gold);display:block;}
.alpha-word{font-family:'Noto Naskh Arabic',serif;font-size:12px;color:var(--muted);margin-top:4px;display:block;}
</style>
</head>
<body>
<div class="kilim"></div>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1>چاوگناس</h1>
      <p class="subtitle">ڕێزمانی کوردی لە باخەڵی تۆدا</p>
    </div>
    <button class="menu-btn" id="menuBtn">☰</button>
  </div>

  <div class="menu-panel" id="menuPanel">
    <button class="menu-item" data-page="home">سەرەتا</button>
    <button class="menu-item" data-page="alphabet">ئەلفوبێی کوردی</button>
    <button class="menu-item" data-page="about">دەربارەی پڕۆژە</button>
  </div>

  <div id="page-home">
    <div class="card">
      <label>لیستی چاوگەکان</label>
      <select id="verbPicker" class="field"></select>
    </div>

    <div class="card">
      <label>چاوگ (وەک: نووسین)</label>
      <input id="infinitive" class="field" dir="rtl" value="نووسین" />
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px;">
        <div>
          <label>ڕەگی کار (ئێستا)</label>
          <input id="presentStem" class="field" dir="rtl" value="نووس" />
        </div>
        <div>
          <label>قەد (ڕابردوو)</label>
          <input id="qad" class="field" dir="rtl" value="نووسی" />
        </div>
      </div>

      <div class="toggle-row">
        <button class="toggle-btn active" id="btnTrans">تێپەڕ</button>
        <button class="toggle-btn" id="btnIntrans">تێنەپەڕ</button>
      </div>

      <button id="btnSaveVerb" class="actionbtn btn-save">پاشەکەوتکردن</button>
      <button id="btnDelVerb" class="actionbtn btn-del" style="display:none;">سڕینەوە</button>
      <p id="msg" class="msg"></p>
    </div>

    <div class="tabs" id="tabs"></div>
    <div id="rows"></div>
  </div>

  <div id="page-alphabet" style="display:none;">
    <h2 class="kurdish" style="color:var(--gold)">ئەلفوبێی کوردی</h2>
    <div class="alpha-grid" id="alphaGrid"></div>
  </div>

  <div id="page-about" style="display:none;">
    <h2 class="kurdish" style="color:var(--gold)">دەربارەی چاوگناس</h2>
    <p class="kurdish" style="line-height:1.8">
      ئەم ئەپە بۆ خزمەتکردنی زمانی کوردی و ئاسانکاری لە دۆزینەوەی شێوەکانی گەردانی کردار دروستکراوە.
      <br><br>
      گەشەپێدەر: د. محەمەد مەجید
      <br>
      زانکۆی گەرمیان
    </p>
  </div>
</div>

<script>
const PERSONS = [
  {pronoun:"من", note:"١ی تاک"}, {pronoun:"تۆ", note:"٢ی تاک"}, {pronoun:"ئەو", note:"٣ی تاک"},
  {pronoun:"ئێمە", note:"١ی کۆ"}, {pronoun:"ئێوە", note:"٢ی کۆ"}, {pronoun:"ئەوان", note:"٣ی کۆ"}
];
const IMP_PERSONS = [{pronoun:"تۆ",note:"تاک"},{pronoun:"ئێوە",note:"کۆ"}];

const ENDINGS_PRES = ["م","یت","ێت","ین","ن","ن"];
const ENDINGS_PAST_INTR = ["م","یت","","ین","ن","ن"];
const CLITICS_TRANS = ["م","ت","ی","مان","تان","یان"];
const ENDINGS_PERFECT = ["م","ی","ە","ین","ن","ن"];
const VOWELS = ["ا","و","ۆ","ه","ە","ێ"];

const SEED_VERBS = [
  {infinitive:"نووسین",presentStem:"نووس",qad:"نووسی",transitive:true},
  {infinitive:"هاتن",presentStem:"هێ",qad:"هات",transitive:false},
  {infinitive:"خوێندن",presentStem:"خوێن",qad:"خوێند",transitive:true},
  {infinitive:"چوون",presentStem:"چۆ",qad:"چوو",transitive:false}
];

const TABS = [
  {id:"pres", label:"ئێستا و داهاتوو"},
  {id:"nzik", label:"ڕابردووی نزیک"},
  {id:"dur", label:"ڕابردووی دوور"},
  {id:"bardewam", label:"ڕابردووی بەردەوام"},
  {id:"tawaw", label:"ڕابردووی تەواو"},
  {id:"subj", label:"دانانی"},
  {id:"imp", label:"داخوازی"}
];

let state = { transitive:true, tab:"pres", editingIndex:-1 };
let verbs = JSON.parse(localStorage.getItem("v4_verbs")) || SEED_VERBS;

const $ = id => document.getElementById(id);

function conjugate(pStem, qad, trans) {
  const [q1, q2] = qad.includes("^") ? qad.split("^") : [null, qad];
  const [s1, s2] = pStem.includes("^") ? pStem.split("^") : [null, pStem];
  
  const link = VOWELS.includes(q2.slice(-1)) ? "" : "ی";
  
  let res = {};

  // 1. کاتی ئێستا
  res.pres = {
    pos: ENDINGS_PRES.map(e => (s1||"") + "دە" + (s2) + e),
    neg: ENDINGS_PRES.map(e => (s1||"") + "نا" + (s2) + e),
    full: true
  };

  // 2. ڕابردووی نزیک
  if(trans) {
    res.nzik = { pos: CLITICS_TRANS.map(e => qad + e), neg: CLITICS_TRANS.map(e => "نە" + e + qad), full:true };
  } else {
    res.nzik = { pos: ENDINGS_PAST_INTR.map(e => qad + e), neg: ENDINGS_PAST_INTR.map(e => "نە" + qad + e), full:true };
  }

  // 3. ڕابردووی دوور
  if(trans) {
    res.dur = { pos: CLITICS_TRANS.map(e => qad + link + "بوو" + e), neg: CLITICS_TRANS.map(e => "نە" + e + qad + link + "بوو"), full:true };
  } else {
    res.dur = { pos: ENDINGS_PAST_INTR.map(e => qad + link + "بوو" + e), neg: ENDINGS_PAST_INTR.map(e => "نە" + qad + link + "بوو" + e), full:true };
  }

  // 4. ڕابردووی تەواو (چاککراو)
  res.tawaw = {
    pos: ENDINGS_PERFECT.map(e => qad + "وو" + e),
    neg: ENDINGS_PERFECT.map(e => "نە" + qad + "وو" + e),
    full: true
  };

  // 5. بەردەوام
  if(trans) {
    res.bardewam = { pos: CLITICS_TRANS.map(e => "دە" + e + qad), neg: CLITICS_TRANS.map(e => "نە" + e + "دە" + qad), full:true };
  } else {
    res.bardewam = { pos: ENDINGS_PAST_INTR.map(e => "دە" + qad + e), neg: ENDINGS_PAST_INTR.map(e => "نە" + qad + e), full:true };
  }

  // 6. دانانی و داخوازی
  const pre = s1 ? s1 : "";
  const core = s2;
  res.subj = {
    pos: ENDINGS_PRES.map(e => pre + "ب" + core + e),
    neg: ENDINGS_PRES.map(e => pre + "نە" + core + e),
    full: true
  };
  
  const impSuf = VOWELS.includes(core.slice(-1)) ? "" : "ە";
  res.imp = {
    pos: [pre + "ب" + core + impSuf, pre + "ب" + core + "ن"],
    neg: [pre + "مە" + core + impSuf, pre + "مە" + core + "ن"],
    full: false
  };

  return res;
}

function render() {
  const data = conjugate($("presentStem").value, $("qad").value, state.transitive);
  const active = data[state.tab];
  const rows = active.full ? PERSONS : IMP_PERSONS;
  
  $("rows").innerHTML = rows.map((p, i) => `
    <div class="card pcard">
      <div class="prow">
        <span class="pronoun">${p.pronoun}</span>
        <span class="pnote">${p.note}</span>
      </div>
      <div class="words">
        <span class="word-pos">${active.pos[i]}</span>
        <span class="word-neg">${active.neg[i]}</span>
      </div>
    </div>
  `).join("");
}

function renderTabs() {
  $("tabs").innerHTML = TABS.map(t => `<button class="tab-btn ${t.id===state.tab?'active':''}" onclick="state.tab='${t.id}';renderTabs();render()">${t.label}</button>`).join("");
}

function initPicker() {
  $("verbPicker").innerHTML = '<option value="">-- هەڵبژاردن --</option>' + verbs.map((v,i)=>`<option value="${i}">${v.infinitive}</option>`).join("");
  $("verbPicker").onchange = (e) => {
    const v = verbs[e.target.value];
    if(!v) return;
    $("infinitive").value = v.infinitive;
    $("presentStem").value = v.presentStem;
    $("qad").value = v.qad;
    state.transitive = v.transitive;
    state.editingIndex = e.target.value;
    updateUI();
    render();
  };
}

function updateUI() {
  $("btnTrans").classList.toggle("active", state.transitive);
  $("btnIntrans").classList.toggle("active", !state.transitive);
  $("btnDelVerb").style.display = state.editingIndex >= 0 ? "block" : "none";
}

$("btnSaveVerb").onclick = () => {
  const v = { infinitive:$("infinitive").value, presentStem:$("presentStem").value, qad:$("qad").value, transitive:state.transitive };
  if(state.editingIndex >= 0) verbs[state.editingIndex] = v; else verbs.push(v);
  localStorage.setItem("v4_verbs", JSON.stringify(verbs));
  initPicker();
  showMsg("پاشەکەوت کرا!");
};

$("btnDelVerb").onclick = () => {
  verbs.splice(state.editingIndex, 1);
  localStorage.setItem("v4_verbs", JSON.stringify(verbs));
  state.editingIndex = -1;
  initPicker();
  updateUI();
  showMsg("سڕایەوە!");
};

function showMsg(t) { 
  $("msg").textContent = t; $("msg").style.display="block"; 
  setTimeout(()=>$ { $("msg").style.display="none" }, 2000); 
}

$("btnTrans").onclick = () => { state.transitive=true; updateUI(); render(); };
$("btnIntrans").onclick = () => { state.transitive=false; updateUI(); render(); };
$("menuBtn").onclick = () => $("menuPanel").classList.toggle("open");
document.querySelectorAll(".menu-item").forEach(btn => {
  btn.onclick = () => {
    const p = btn.dataset.page;
    ["home","alphabet","about"].forEach(id => $("page-"+id).style.display = id===p?"block":"none");
    $("menuPanel").classList.remove("open");
  };
});

initPicker();
renderTabs();
render();
</script>
</body>
</html>
